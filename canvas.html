<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    
    <script src="https://documentforce.com/canvas/sdk/js/43.0/canvas-all.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Salesforce Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .user-info {
            color: #666;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card.total {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .stat-card.low-stock {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        
        .stat-card.value {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }
        
        .stat-card.categories {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls input, .controls select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .controls input:focus, .controls select:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .controls button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        
        .controls button:hover {
            transform: scale(1.05);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        
        .product-table {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .low-stock-row {
            background: #fff5f5;
        }
        
        .low-stock-badge {
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-adjust {
            background: #4facfe;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-edit {
            background: #43e97b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-delete {
            background: #f5576c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .charts {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 50px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #666;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        .success-message {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📦 Product Dashboard</h1>
            <div class="user-info" id="userInfo">Loading user information...</div>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Total Products</div>
            </div>
            <div class="stat-card value">
                <div class="stat-value" id="totalValue">$0</div>
                <div class="stat-label">Total Product Value</div>
            </div>
            <div class="stat-card categories">
                <div class="stat-value" id="categoryCount">0</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search products...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Food">Food</option>
                <option value="Other">Other</option>
            </select>
            <button onclick="loadProduct()">🔄 Refresh</button>
            <button onclick="showAddProductModal()">➕ Add Product</button>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="main-content">
            <div class="product-table">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    Loading product...
                </div>
                <table id="productTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                            <th>Total Value</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productBody"></tbody>
                </table>
            </div>
            
            <div class="charts">
                <div class="chart-container">
                    <div class="chart-title">Category Distribution</div>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add New Product</div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="productCategory" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Food">Food</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" id="productQuantity" min="0" required>
                </div>
                <div class="form-group">
                    <label>Unit Price *</label>
                    <input type="number" id="productPrice" min="0" step="0.01" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="modal" id="adjustModal">
        <div class="modal-content">
            <div class="modal-header">Adjust Quantity</div>
            <form id="adjustForm">
                <input type="hidden" id="adjustProductId">
                <div class="form-group">
                    <label>Current Quantity: <span id="currentQuantity"></span></label>
                </div>
                <div class="form-group">
                    <label>Adjustment Type</label>
                    <select id="adjustType">
                        <option value="add">Add</option>
                        <option value="subtract">Subtract</option>
                        <option value="set">Set To</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="adjustAmount" min="0" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" onclick="closeAdjustModal()">Cancel</button>
                    <button type="submit">Apply</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        let signedRequest;
        let accessToken;
        let instanceUrl;
        let currentProduct = [];
        let categoryChartInstance;
        
        Sfdc.canvas(function() {
            signedRequest = Sfdc.canvas.client.signedrequest();
            
            if (signedRequest) {
                const context = signedRequest.context;
                const user = context.user;
                
                document.getElementById('userInfo').innerHTML = 
                    `Welcome, ${user.fullName} | ${context.organization.name}`;
                
                accessToken = signedRequest.client.oauthToken;
                instanceUrl = signedRequest.client.instanceUrl;
                
                loadProduct();
                setInterval(loadProduct, 30000);
            }
        });
        
        async function loadProduct() {
            showLoading(true);
            hideMessages();
            
            try {
                const params = new URLSearchParams();
                const searchValue = document.getElementById('searchInput').value;
                const categoryValue = document.getElementById('categoryFilter').value;
                
                if (searchValue) params.append('search', searchValue);
                if (categoryValue) params.append('category', categoryValue);
                
                const response = await makeApiCall('GET', '/Product/?' + params.toString());
                
                if (response.success) {
                    currentProduct = response.products || [];
                    updateStats(response.summary);
                    renderProductTable(currentProduct);
                    updateCharts(response.summary);
                } else {
                    showError(response.errorMessage || 'Failed to load product');
                }
            } catch (error) {
                showError('Error loading product: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function makeApiCall(method, endpoint, body = null) {
            const url = `${instanceUrl}/services/apexrest${endpoint}`;
            
            const options = {
                method: method,
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json'
                }
            };
            
            if (body) {
                options.body = JSON.stringify(body);
            }
            
            const response = await fetch(url, options);
            return await response.json();
        }
        
        function updateStats(summary) {
            if (!summary) return;
            
            document.getElementById('totalProducts').textContent = summary.totalProducts || 0;
            document.getElementById('totalValue').textContent = '$' + formatNumber(summary.totalValue || 0);
            
            const categoryCount = summary.categoryBreakdown ? 
                Object.keys(summary.categoryBreakdown).length : 0;
            document.getElementById('categoryCount').textContent = categoryCount;
        }
        
        function renderProductTable(products) {
            const tbody = document.getElementById('productBody');
            tbody.innerHTML = '';
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No products found</td></tr>';
                document.getElementById('productTable').style.display = 'table';
                return;
            }
            
            products.forEach(product => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${product.productName}</td>
                    <td>${product.category || 'Other'}</td>
                    <td>${product.quantity}</td>
                    <td>$${formatNumber(product.unitPrice)}</td>
                    <td>$${formatNumber(product.totalValue)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-adjust" onclick="showAdjustModal('${product.id}', ${product.quantity})">
                                Adjust
                            </button>
                            <button class="btn-edit" onclick="editProduct('${product.id}')">
                                Edit
                            </button>
                            <button class="btn-delete" onclick="deleteProduct('${product.id}', '${product.productName}')">
                                Delete
                            </button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
            
            document.getElementById('productTable').style.display = 'table';
        }
        
        function updateCharts(summary) {
            if (!summary) return;
            
            const categoryCtx = document.getElementById('categoryChart').getContext('2d');
            
            if (categoryChartInstance) {
                categoryChartInstance.destroy();
            }
            
            const categoryData = summary.categoryBreakdown || {};
            categoryChartInstance = new Chart(categoryCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryData),
                    datasets: [{
                        data: Object.values(categoryData),
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb',
                            '#4facfe'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const productId = document.getElementById('productId').value;
            const productData = {
                productName: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                quantity: parseInt(document.getElementById('productQuantity').value),
                unitPrice: parseFloat(document.getElementById('productPrice').value),
            };
            
            try {
                let response;
                if (productId) {
                    productData.id = productId;
                    response = await makeApiCall('PUT', '/Product/', productData);
                } else {
                    response = await makeApiCall('POST', '/Product/', productData);
                }
                
                if (response.success) {
                    showSuccess(response.message || 'Product saved successfully');
                    closeModal();
                    loadProduct();
                } else {
                    showError(response.errorMessage || 'Failed to save product');
                }
            } catch (error) {
                showError('Error saving product: ' + error.message);
            }
        });
        
        document.getElementById('adjustForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const adjustData = {
                id: document.getElementById('adjustProductId').value,
                adjustment: parseInt(document.getElementById('adjustAmount').value),
                type: document.getElementById('adjustType').value
            };
            
            try {
                const response = await makeApiCall('PATCH', '/Product/', adjustData);
                
                if (response.success) {
                    showSuccess(response.message || 'Quantity adjusted successfully');
                    closeAdjustModal();
                    loadProduct();
                } else {
                    showError(response.errorMessage || 'Failed to adjust quantity');
                }
            } catch (error) {
                showError('Error adjusting quantity: ' + error.message);
            }
        });
        
        function showAddProductModal() {
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }
        
        async function editProduct(productId) {
            const product = currentProduct.find(p => p.id === productId);
            if (product) {
                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('productId').value = product.id;
                document.getElementById('productName').value = product.productName;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productQuantity').value = product.quantity;
                document.getElementById('productPrice').value = product.unitPrice;
                document.getElementById('productModal').style.display = 'flex';
            }
        }
        
        async function deleteProduct(productId, productName) {
            if (!confirm(`Are you sure you want to delete "${productName}"?`)) {
                return;
            }
            
            try {
                const response = await makeApiCall('DELETE', '/Product/' + productId);
                
                if (response.success) {
                    showSuccess(response.message || 'Product deleted successfully');
                    loadProduct();
                } else {
                    showError(response.errorMessage || 'Failed to delete product');
                }
            } catch (error) {
                showError('Error deleting product: ' + error.message);
            }
        }
        
        function showAdjustModal(productId, currentQty) {
            document.getElementById('adjustProductId').value = productId;
            document.getElementById('currentQuantity').textContent = currentQty;
            document.getElementById('adjustForm').reset();
            document.getElementById('adjustModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }
        
        function closeAdjustModal() {
            document.getElementById('adjustModal').style.display = 'none';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('productTable').style.display = 'none';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }
        
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }
        
        function formatNumber(num) {
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
